name: gestionahub
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gestionahub-app:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_ENV: ${DOCKER_APP_ENV:-production}
      APP_DEBUG: ${DOCKER_APP_DEBUG:-false}
      APP_URL: ${DOCKER_APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:-gestionahub}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-gestionahub}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-gestionahub_secret}
      RUN_MIGRATIONS: "true"
    ports:
      - "${DOCKER_APP_PORT:-8000}:80"
    volumes:
      - storage_app:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
  queue:
    image: gestionahub-app:latest
    restart: unless-stopped
    user: www-data
    env_file: .env
    environment:
      APP_ENV: ${DOCKER_APP_ENV:-production}
      APP_DEBUG: ${DOCKER_APP_DEBUG:-false}
      APP_URL: ${DOCKER_APP_URL:-http://localhost:8000}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DOCKER_DB_DATABASE:-gestionahub}
      DB_USERNAME: ${DOCKER_DB_USERNAME:-gestionahub}
      DB_PASSWORD: ${DOCKER_DB_PASSWORD:-gestionahub_secret}
      RUN_MIGRATIONS: "false"
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--max-time=3600"]
    healthcheck:
      disable: true
    volumes:
      - storage_app:/var/www/html/storage/app
    depends_on:
      app:
        condition: service_healthy
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: ${DOCKER_DB_DATABASE:-gestionahub}
      MYSQL_USER: ${DOCKER_DB_USERNAME:-gestionahub}
      MYSQL_PASSWORD: ${DOCKER_DB_PASSWORD:-gestionahub_secret}
      MYSQL_ROOT_PASSWORD: ${DOCKER_DB_ROOT_PASSWORD:-root_secret}
      TZ: America/Lima
    ports:
      - "${DOCKER_DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
volumes:
  mysql_data:
  storage_app: